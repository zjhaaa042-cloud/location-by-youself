name: LocationMocker
options:
  bundleIdPrefix: com.example.locationmocker
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  LocationMocker:
    type: application
    platform: iOS
    sources:
      - path: LocationMocker
    settings:
      base:
        INFOPLIST_FILE: LocationMocker/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.locationmocker
        DEVELOPMENT_TEAM: ""
    dependencies: []

  LocationMockerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LocationMockerTests
    dependencies:
      - target: LocationMocker
    settings:
      base:
        INFOPLIST_FILE: LocationMockerTests/Info.plist
